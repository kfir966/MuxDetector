[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muxfind"
version = "0.1.0"
description = "Functional MUX detection for Synopsys Liberty libraries"
requires-python = ">=3.10"

[project.scripts]
muxfind = "muxfind.cli:main"

[tool.setuptools.packages.find]
include = ["muxfind*"]
